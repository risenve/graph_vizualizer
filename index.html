<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Растяжка кадра</title>
<style>
/* Layout: black full-bleed stage; compact tweak panel floats top-right (bottom sheet on phones). Single dark look by design. */
:root{
  --stage:#000000; --panel:#2A2A2E; --folder:#232326; --row:#2F2F33; --fg:#C9CAD1; --muted:#8C8D96;
  --ctl:#3A3A3F; --ctl-hi:#45454B; --knob:#B8B9C1; --btn:#ADAFB8; --btn-fg:#1C1C1F; --accent:#91E2FF;
  --mono:"SF Mono","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--stage);color:var(--fg);font-family:var(--mono);font-size:12px;overflow:hidden}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{position:relative}
.wrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{touch-action:none}
.cursor{position:absolute;border:1px solid #fff;outline:1px solid rgba(0,0,0,.5);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);display:none}
.stage.dragging::after{content:"";position:absolute;inset:12px;border:1px dashed var(--muted);border-radius:8px;pointer-events:none}

.pane{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:300px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  overflow-y:auto;background:var(--panel);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);padding:4px 0 6px;scrollbar-width:thin}
.fold{margin:2px 0}
.fh{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:var(--fg);font:inherit;font-size:12.5px;padding:7px 10px;cursor:pointer;text-align:left}
.fh::after{content:"";width:6px;height:10px;border-radius:3px;border:1.5px solid var(--muted);opacity:.8}
.fold.closed .fh::after{height:6px}
.fb{background:var(--folder);padding:3px 0;display:grid}
.fold.closed .fb{display:none}
.r{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:8px;padding:3px 8px 3px 10px;min-height:26px}
.r>span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl{display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:6px;align-items:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ctl-hi);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--ctl-hi);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:14px;border-radius:3px;background:var(--knob);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:12px;height:14px;border-radius:3px;background:var(--knob);border:0}
input[type=number],select{font:inherit;color:var(--fg);background:var(--ctl);border:0;border-radius:3px;height:22px;width:100%;padding:0 6px;box-sizing:border-box}
input[type=number]{text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
select{background:var(--btn);color:var(--btn-fg);font-weight:600;cursor:pointer;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--btn-fg) 50%),linear-gradient(135deg,var(--btn-fg) 50%,transparent 50%);
  background-position:calc(100% - 12px) 9px,calc(100% - 8px) 9px;background-size:4px 4px;background-repeat:no-repeat;padding-right:22px}
button.b{font:inherit;font-weight:600;color:var(--btn-fg);background:var(--btn);border:0;border-radius:3px;height:22px;padding:0 8px;cursor:pointer;width:100%}
button.b:hover,select:hover{filter:brightness(1.08)}
button.b:active{filter:brightness(.92)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:3px}
.grid button.b{background:var(--ctl);color:var(--fg);font-weight:400}
.grid button.b[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);font-weight:600}
.ck{width:14px;height:14px;margin:0;accent-color:var(--knob);cursor:pointer}
.col{display:flex;gap:6px;align-items:center}
.col input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;cursor:pointer;border-radius:3px}
.sw{display:flex;gap:3px;flex-wrap:wrap}
.sw button{width:14px;height:14px;border-radius:2px;border:1px solid rgba(255,255,255,.15);padding:0;cursor:pointer}
.r.dim{opacity:.35;pointer-events:none}
:focus-visible{outline:1px solid var(--accent);outline-offset:1px}
.meta{color:var(--muted);padding:2px 10px 4px;font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--fg);padding:7px 12px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.toast.show{opacity:1}
@media (max-width:760px){
  .pane{top:auto;bottom:0;left:0;right:0;width:auto;max-height:46%;border-radius:10px 10px 0 0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .stage{bottom:46%}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="wrap" id="wrap"><canvas id="view"></canvas><canvas id="ov"></canvas><div class="cursor" id="cursor"></div></div>
</div>
<div class="pane" id="pane"></div>
<input id="file" type="file" accept="image/*" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
(()=>{
const S={dir:'h',src:'edges',pos:50,band:4,soft:12,grain:14,grainAll:false,global:true,win:true,shape:'porthole',wx:50,wy:52,wsize:52,feather:0,
  frame:false,lines:false,fcolor:'#91E2FF',tool:'none',bsize:160,bhard:40,bflow:60,showMask:false,
  light:true,lightAmt:70,warm:20,leak:'off',leakSize:35,
  fmt:'png',q:92,preset:'orig'};
const SW=['#91E2FF','#3AA6EE','#13B3AE','#42A85C','#6B6A35','#E6A53A','#F0735A','#9C93C6','#FFFFFF','#141414'];
const MAXSIDE=4000;
const $=id=>document.getElementById(id);
const mk=()=>document.createElement('canvas');
const view=$('view'),ov=$('ov'),wrap=$('wrap'),stage=$('stage'),cursor=$('cursor'),pane=$('pane');
const srcC=mk(),strC=mk(),maskC=mk(),addC=mk(),remC=mk(),tmpC=mk(),lightC=mk(),litC=mk();
const ctx=c=>c.getContext('2d');
const sctx=srcC.getContext('2d',{willReadFrequently:true});
let W=0,H=0,compare=false,undoStack=[],fileBase='flypartner';
let dlP=null;try{dlP=window.claude&&window.claude.use?window.claude.use('downloads'):null}catch(e){dlP=null}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

// ---------- sample ----------
function sample(){const c=mk();c.width=2400;c.height=1500;const g=ctx(c);const w=c.width,h=c.height,hz=h*0.56;
  let gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,'#E9B8A6');gr.addColorStop(.55,'#F3CDB6');gr.addColorStop(1,'#F8E2CF');g.fillStyle=gr;g.fillRect(0,0,w,hz);
  let sun=g.createRadialGradient(w*.63,hz-150,10,w*.63,hz-150,380);sun.addColorStop(0,'rgba(255,246,228,1)');sun.addColorStop(.18,'rgba(255,238,214,.9)');sun.addColorStop(1,'rgba(255,238,214,0)');g.fillStyle=sun;g.fillRect(0,0,w,hz);
  g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<9;i++){const y=60+i*55+Math.sin(i*3)*20,x=(i*997)%w;g.beginPath();g.ellipse(x,y,260+(i*73)%300,10+(i*7)%12,0,0,Math.PI*2);g.fill()}
  g.fillStyle='#B98F96';g.beginPath();g.moveTo(0,hz);let x=0;while(x<w){const yy=hz-30-Math.abs(Math.sin(x/170)*90)-Math.abs(Math.sin(x/53))*25;g.lineTo(x,yy);x+=22}g.lineTo(w,hz);g.closePath();g.fill();
  g.fillStyle='#8F6F80';g.beginPath();g.moveTo(w*.05,hz);g.quadraticCurveTo(w*.18,hz-260,w*.33,hz);g.closePath();g.fill();
  g.beginPath();g.moveTo(w*.74,hz);g.quadraticCurveTo(w*.86,hz-200,w*.98,hz);g.closePath();g.fill();
  gr=g.createLinearGradient(0,hz,0,h);gr.addColorStop(0,'#A895B4');gr.addColorStop(.35,'#6E648C');gr.addColorStop(1,'#2F2B45');g.fillStyle=gr;g.fillRect(0,hz,w,h-hz);
  for(let i=0;i<260;i++){const r1=(Math.sin(i*12.9898)*43758.5453)%1,r2=(Math.sin(i*78.233)*12345.678)%1;const y=hz+Math.pow(Math.abs(r1),1.6)*(h-hz),len=40+Math.abs(r2)*260;g.fillStyle=`rgba(255,220,205,${.08+Math.abs(r2)*.25})`;g.fillRect(Math.abs(r2*w*7)%w,y,len,2+Math.abs(r1)*3)}
  g.fillStyle='rgba(255,235,210,.55)';g.fillRect(w*.6,hz,w*.06,h*.25);
  g.fillStyle='#231F2E';g.beginPath();g.moveTo(w*.40,hz+150);g.lineTo(w*.52,hz+150);g.lineTo(w*.50,hz+178);g.lineTo(w*.42,hz+178);g.closePath();g.fill();g.fillRect(w*.455,hz+90,6,60);
  return c}

// ---------- image io ----------
function setImage(img,name){let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const k=Math.min(1,MAXSIDE/Math.max(w,h));W=Math.round(w*k);H=Math.round(h*k);
  for(const c of [srcC,strC,maskC,addC,remC,tmpC,lightC,litC,view,ov]){c.width=W;c.height=H}
  sctx.drawImage(img,0,0,W,H);undoStack=[];if(name)fileBase=name.replace(/\.[^.]+$/,'').slice(0,60)||'flypartner';
  const m=$('meta');if(m)m.textContent=W+'×'+H;fit();need.s=need.m=true;sync();schedule()}
function loadFile(f){if(!f||!f.type.startsWith('image/')){toast('Нужен JPG, PNG или WebP');return}
  const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{setImage(im,f.name);URL.revokeObjectURL(url)};im.onerror=()=>toast('Файл не открылся (HEIC → JPG)');im.src=url}
$('file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value=''});
stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('dragging')});
stage.addEventListener('dragleave',()=>stage.classList.remove('dragging'));
stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('dragging');loadFile(e.dataTransfer.files[0])});
window.addEventListener('paste',e=>{const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(it)loadFile(it.getAsFile())});
function fit(){if(!W)return;const r=stage.getBoundingClientRect();const wide=window.innerWidth>760;const padR=wide?pane.offsetWidth+36:16,padL=wide?36:16,padY=wide?36:16;
  const s=Math.min((r.width-padL-padR)/W,(r.height-padY*2)/H);wrap.style.width=Math.max(40,W*s)+'px';wrap.style.height=Math.max(40,H*s)+'px';wrap.style.marginRight=wide?(padR-padL)+'px':'0'}
new ResizeObserver(fit).observe(stage);

// ---------- geometry ----------
function winR(){const cx=S.wx/100*W,cy=S.wy/100*H;if(S.shape==='band'){const h=S.wsize/100*H*0.6;return{x:0,y:cy-h/2,w:W,h,cx,cy,r:0}}
  const h=S.wsize/100*H,w=h*120/152;return{x:cx-w/2,y:cy-h/2,w,h,cx,cy,r:w*0.4}}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- stripes ----------
function blur1(a,n,rad){if(rad<0.5)return a;const r=Math.ceil(rad*2),k=[];let s=0;for(let i=-r;i<=r;i++){const v=Math.exp(-i*i/(2*rad*rad));k.push(v);s+=v}for(let i=0;i<k.length;i++)k[i]/=s;
  const o=new Float32Array(n*3);for(let i=0;i<n;i++){let R=0,G=0,B=0;for(let j=-r;j<=r;j++){const p=clamp(i+j,0,n-1)*3,kv=k[j+r];R+=a[p]*kv;G+=a[p+1]*kv;B+=a[p+2]*kv}o[i*3]=R;o[i*3+1]=G;o[i*3+2]=B}return o}
function lineStrip(at,vertical){const b=Math.max(1,Math.round(S.band*Math.max(W,H)/2000));let n,a;
  if(!vertical){const x0=clamp(Math.round(at-b/2),0,W-b);const d=sctx.getImageData(x0,0,b,H).data;n=H;a=new Float32Array(n*3);
    for(let y=0;y<H;y++){let R=0,G=0,B=0;for(let x=0;x<b;x++){const p=(y*b+x)*4;R+=d[p];G+=d[p+1];B+=d[p+2]}a[y*3]=R/b;a[y*3+1]=G/b;a[y*3+2]=B/b}}
  else{const y0=clamp(Math.round(at-b/2),0,H-b);const d=sctx.getImageData(0,y0,W,b).data;n=W;a=new Float32Array(n*3);
    for(let x=0;x<W;x++){let R=0,G=0,B=0;for(let y=0;y<b;y++){const p=(y*W+x)*4;R+=d[p];G+=d[p+1];B+=d[p+2]}a[x*3]=R/b;a[x*3+1]=G/b;a[x*3+2]=B/b}}
  a=blur1(a,n,S.soft*n/2000);const c=mk();if(!vertical){c.width=1;c.height=n}else{c.width=n;c.height=1}
  const id=new ImageData(c.width,c.height);for(let i=0;i<n;i++){id.data[i*4]=a[i*3];id.data[i*4+1]=a[i*3+1];id.data[i*4+2]=a[i*3+2];id.data[i*4+3]=255}c.getContext('2d').putImageData(id,0,0);return c}
let noiseTile=null;function noise(){if(noiseTile)return noiseTile;const c=mk();c.width=c.height=256;const g=ctx(c),d=g.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);noiseTile=c;return c}
function grainOn(g,amt){g.save();g.globalAlpha=amt/100;g.globalCompositeOperation='overlay';g.fillStyle=g.createPattern(noise(),'repeat');g.fillRect(0,0,W,H);g.restore()}
function buildStripes(){const g=ctx(strC);g.imageSmoothingEnabled=true;g.clearRect(0,0,W,H);const R=winR();
  const edges=S.src==='edges'&&S.win&&!(S.dir==='h'&&S.shape==='band');
  const blend=(a,vertical,c0,len)=>{const t=ctx(tmpC);t.save();t.clearRect(0,0,W,H);
    if(!vertical)t.drawImage(a,0,0,1,H,0,0,W,H);else t.drawImage(a,0,0,W,1,0,0,W,H);
    const gr=vertical?t.createLinearGradient(0,c0-len,0,c0+len):t.createLinearGradient(c0-len,0,c0+len,0);gr.addColorStop(0,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');
    t.globalCompositeOperation='destination-in';t.fillStyle=gr;t.fillRect(0,0,W,H);t.restore();g.drawImage(tmpC,0,0)};
  if(S.dir==='h'){if(edges){const a=lineStrip(clamp(R.x+R.w*0.02,0,W-1),false),b=lineStrip(clamp(R.x+R.w*0.98,0,W-1),false);g.drawImage(b,0,0,1,H,0,0,W,H);blend(a,false,R.cx,Math.max(2,R.w*0.45))}
    else{g.drawImage(lineStrip(S.pos/100*(W-1),false),0,0,1,H,0,0,W,H)}}
  else{if(edges){const a=lineStrip(clamp(R.y+R.h*0.02,0,H-1),true),b=lineStrip(clamp(R.y+R.h*0.98,0,H-1),true);g.drawImage(b,0,0,W,1,0,0,W,H);blend(a,true,R.cy,Math.max(2,R.h*0.45))}
    else{g.drawImage(lineStrip(S.pos/100*(H-1),true),0,0,W,1,0,0,W,H)}}
  if(S.grain>0&&!S.grainAll)grainOn(g,S.grain)}

// ---------- mask ----------
function shapePath(g,R,inset){if(S.shape==='band'){g.beginPath();g.rect(-10,R.y+inset,W+20,Math.max(1,R.h-2*inset));return}rr(g,R.x+inset,R.y+inset,Math.max(1,R.w-2*inset),Math.max(1,R.h-2*inset),Math.max(0,R.r-inset))}
function buildMask(){const g=ctx(maskC);g.save();g.clearRect(0,0,W,H);if(S.global){g.fillStyle='#fff';g.fillRect(0,0,W,H)}
  if(S.win){const R=winR();const f=S.feather/100*Math.min(R.w,R.h)*0.35;g.globalCompositeOperation='destination-out';g.fillStyle='#000';
    if(f>0.5){const off=W*3+f*8;g.save();g.shadowColor='#000';g.shadowBlur=f;g.shadowOffsetX=off;g.translate(-off,0);shapePath(g,R,f*0.5);g.fill();g.restore()}else{shapePath(g,R,0);g.fill()}}
  g.globalCompositeOperation='source-over';g.drawImage(addC,0,0);g.globalCompositeOperation='destination-out';g.drawImage(remC,0,0);g.restore()}

// ---------- light (засвет) ----------
function lightColor(){const w=S.warm/100;const r=255,g=Math.round(255-w*40),b=Math.round(255-w*95);return`rgb(${r},${g},${b})`}
function buildLit(){const g=ctx(litC);g.save();g.clearRect(0,0,W,H);g.drawImage(lightC,0,0);
  if(S.leak!=='off'){const L=S.leakSize/100;let gr;
    if(S.leak==='top')gr=g.createLinearGradient(0,0,0,H*L);else if(S.leak==='bottom')gr=g.createLinearGradient(0,H,0,H*(1-L));
    else if(S.leak==='left')gr=g.createLinearGradient(0,0,W*L,0);else if(S.leak==='right')gr=g.createLinearGradient(W,0,W*(1-L),0);
    else{const cx=S.leak==='corner'?W:W/2,cy=S.leak==='corner'?0:H/2;gr=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*L*1.2)}
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.45,'rgba(255,255,255,.45)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H)}
  g.globalCompositeOperation='source-in';g.fillStyle=lightColor();g.fillRect(0,0,W,H);g.restore()}

// ---------- compose ----------
function drawBrand(g){if(!S.win)return;const R=winR();const col=S.fcolor;
  if(S.lines){const th=Math.max(3,(S.shape==='band'?H*0.03:R.w)*0.035),y=R.cy-th;
    g.fillStyle=col;g.fillRect(0,y,R.cx,th);g.fillRect(R.cx,y+th,W-R.cx,th);g.fillStyle='#FFFFFF';g.fillRect(0,y+th,R.cx,th);g.fillRect(R.cx,y,W-R.cx,th)}
  if(S.frame&&S.shape==='porthole'){const t=Math.max(3,R.w*0.03);g.fillStyle=col;rr(g,R.x-2*t,R.y-2*t,R.w+4*t,R.h+4*t,R.r+2*t);g.fill();g.fillStyle='#FFFFFF';rr(g,R.x-t,R.y-t,R.w+2*t,R.h+2*t,R.r+t);g.fill();
    g.save();rr(g,R.x,R.y,R.w,R.h,R.r);g.clip();g.drawImage(srcC,0,0);g.restore()}}
function compose(target){const g=ctx(target);g.clearRect(0,0,W,H);g.drawImage(srcC,0,0);if(compare)return;
  const t=ctx(tmpC);t.save();t.clearRect(0,0,W,H);t.drawImage(strC,0,0);t.globalCompositeOperation='destination-in';t.drawImage(maskC,0,0);t.restore();g.drawImage(tmpC,0,0);drawBrand(g);
  if(S.light){g.save();g.globalCompositeOperation='screen';g.globalAlpha=S.lightAmt/100;g.drawImage(litC,0,0);g.restore()}
  if(S.grain>0&&S.grainAll)grainOn(g,S.grain)}
function overlay(){const g=ctx(ov);g.clearRect(0,0,W,H);if(compare)return;
  if(S.showMask){g.save();g.drawImage(maskC,0,0);g.globalCompositeOperation='source-in';g.fillStyle='rgba(255,40,60,.45)';g.fillRect(0,0,W,H);g.restore()}
  if(S.win&&S.tool==='none'){const R=winR();const sc=W/Math.max(1,wrap.clientWidth);g.save();g.setLineDash([6*sc,5*sc]);g.lineWidth=1*sc;g.strokeStyle='rgba(255,255,255,.85)';
    if(S.shape==='band'){g.strokeRect(-2,R.y,W+4,R.h)}else{rr(g,R.x,R.y,R.w,R.h,R.r);g.stroke()}g.restore()}}
const need={s:true,m:true,l:true};let raf=0;
function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;if(!W)return;if(need.s){buildStripes();need.s=false}if(need.m){buildMask();need.m=false}if(need.l){buildLit();need.l=false}compose(view);overlay()})}

// ---------- panel ----------
const affects={dir:'sm',src:'s',pos:'s',band:'s',soft:'s',grain:'s',grainAll:'s',global:'m',win:'sm',shape:'sm',wsize:'sm',feather:'m',leak:'l',leakSize:'l',warm:'l'};
function set(k,v){S[k]=v;const a=affects[k]||'';if(a.includes('s'))need.s=true;if(a.includes('m'))need.m=true;if(a.includes('l'))need.l=true;sync();schedule()}
const DEF=[
 ['Фото',[{t:'act',l:'файл',b:'Загрузить',f:()=>$('file').click()},{t:'hold',l:'сравнить',b:'Оригинал'},{t:'act',l:'история',b:'Отменить',f:()=>undo()},{t:'meta'}]],
 ['Растяжка',[{t:'sel',k:'dir',l:'направление',o:[['h','горизонталь'],['v','вертикаль']]},{t:'sel',k:'src',l:'источник',o:[['edges','края окна'],['line','одна линия']]},
   {t:'rng',k:'pos',l:'линия',min:0,max:100,st:.1,dim:()=>S.src==='edges'&&S.win&&!(S.dir==='h'&&S.shape==='band')},{t:'rng',k:'band',l:'выборка',min:1,max:120},{t:'rng',k:'soft',l:'размытие',min:0,max:100},
   {t:'rng',k:'grain',l:'зерно',min:0,max:60},{t:'chk',k:'grainAll',l:'зерно везде'}]],
 ['Маска',[{t:'chk',k:'global',l:'всё фото'},{t:'chk',k:'win',l:'окно'},{t:'sel',k:'shape',l:'форма',o:[['porthole','иллюминатор'],['band','полоса']],dim:()=>!S.win},
   {t:'rng',k:'wsize',l:'размер',min:10,max:100,dim:()=>!S.win},{t:'rng',k:'feather',l:'край',min:0,max:100,dim:()=>!S.win},{t:'chk',k:'showMask',l:'показать'}]],
 ['Кисть',[{t:'tools',k:'tool',o:[['none','окно'],['stripes','полосы'],['photo','фото'],['light','свет'],['erase','ластик']]},
   {t:'rng',k:'bsize',l:'размер',min:10,max:600},{t:'rng',k:'bhard',l:'жёсткость',min:0,max:95},{t:'rng',k:'bflow',l:'нажим',min:5,max:100},{t:'act',l:'сброс',b:'Очистить кисть',f:()=>{pushUndo();for(const c of [addC,remC,lightC])ctx(c).clearRect(0,0,W,H);need.m=need.l=true;schedule()}}]],
 ['Засвет',[{t:'chk',k:'light',l:'включить'},{t:'rng',k:'lightAmt',l:'сила',min:0,max:100},{t:'rng',k:'warm',l:'тепло',min:0,max:100},
   {t:'sel',k:'leak',l:'градиент',o:[['off','нет'],['top','сверху'],['bottom','снизу'],['left','слева'],['right','справа'],['corner','из угла'],['center','из центра']]},
   {t:'rng',k:'leakSize',l:'длина',min:5,max:100,dim:()=>S.leak==='off'}]],
 ['Графика',[{t:'chk',k:'frame',l:'рамка'},{t:'chk',k:'lines',l:'линии'},{t:'color',k:'fcolor',l:'цвет'}]],
 ['Экспорт',[{t:'sel',k:'fmt',l:'формат',o:[['png','PNG'],['jpg','JPG'],['webp','WebP']]},{t:'rng',k:'q',l:'качество',min:40,max:100,dim:()=>S.fmt==='png'},
   {t:'sel',k:'preset',l:'размер',o:[['orig','оригинал'],['1080x1350','1080×1350'],['1920x1080','1920×1080'],['1080x1920','1080×1920'],['3840x2160','3840×2160']]},
   {t:'act',l:'изображение',b:'Скачать',f:()=>exportImg()},{t:'act',l:'маска',b:'Скачать маску',f:()=>exportMask()}]]];
const binds=[];let uid=0;
function row(l){const r=document.createElement('div');r.className='r';const s=document.createElement('span');s.textContent=l;r.appendChild(s);return r}
DEF.forEach(([title,items],fi)=>{const f=document.createElement('div');f.className='fold';const h=document.createElement('button');h.className='fh';h.textContent=title;h.setAttribute('aria-expanded','true');
  h.onclick=()=>{f.classList.toggle('closed');h.setAttribute('aria-expanded',String(!f.classList.contains('closed')));fit()};const b=document.createElement('div');b.className='fb';f.append(h,b);pane.appendChild(f);
  items.forEach(it=>{let r;
    if(it.t==='meta'){r=document.createElement('div');r.className='meta';r.id='meta';b.appendChild(r);return}
    if(it.t==='tools'){r=document.createElement('div');r.className='r';r.style.gridTemplateColumns='1fr';const g=document.createElement('div');g.className='grid';
      it.o.forEach(([v,l])=>{const x=document.createElement('button');x.className='b';x.textContent=l;x.onclick=()=>set(it.k,v);g.appendChild(x)});r.appendChild(g);b.appendChild(r);
      binds.push(()=>g.querySelectorAll('button').forEach((x,i)=>x.setAttribute('aria-pressed',String(it.o[i][0]===S[it.k]))));return}
    r=row(it.l);b.appendChild(r);const id='c'+(uid++);r.querySelector('span').id=id+'l';
    if(it.t==='act'||it.t==='hold'){const x=document.createElement('button');x.className='b';x.textContent=it.b;x.id=id;r.appendChild(x);
      if(it.t==='act')x.onclick=it.f;else{const on=()=>{compare=true;schedule()},off=()=>{if(compare){compare=false;schedule()}};x.addEventListener('pointerdown',on);x.addEventListener('pointerup',off);x.addEventListener('pointerleave',off);x.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();on()}});x.addEventListener('keyup',off)}}
    else if(it.t==='rng'){const w=document.createElement('div');w.className='sl';const s=document.createElement('input');s.type='range';s.min=it.min;s.max=it.max;s.step=it.st||1;s.id=id;s.setAttribute('aria-labelledby',id+'l');
      const n=document.createElement('input');n.type='number';n.min=it.min;n.max=it.max;n.step=it.st||1;n.id=id+'n';n.setAttribute('aria-labelledby',id+'l');
      s.oninput=()=>set(it.k,+s.value);n.onchange=()=>set(it.k,clamp(+n.value||0,it.min,it.max));w.append(s,n);r.appendChild(w);
      binds.push(()=>{if(document.activeElement!==s)s.value=S[it.k];if(document.activeElement!==n)n.value=(it.st&&it.st<1)?(+S[it.k]).toFixed(1):Math.round(S[it.k]);r.classList.toggle('dim',!!(it.dim&&it.dim()))})}
    else if(it.t==='sel'){const s=document.createElement('select');s.id=id;s.setAttribute('aria-labelledby',id+'l');it.o.forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;s.appendChild(o)});s.onchange=()=>set(it.k,s.value);r.appendChild(s);
      binds.push(()=>{s.value=S[it.k];r.classList.toggle('dim',!!(it.dim&&it.dim()))})}
    else if(it.t==='chk'){const c=document.createElement('input');c.type='checkbox';c.className='ck';c.id=id;c.setAttribute('aria-labelledby',id+'l');c.onchange=()=>set(it.k,c.checked);r.appendChild(c);binds.push(()=>{c.checked=!!S[it.k]})}
    else if(it.t==='color'){const w=document.createElement('div');w.className='col';const c=document.createElement('input');c.type='color';c.id=id;c.setAttribute('aria-labelledby',id+'l');c.oninput=()=>set(it.k,c.value);
      const sw=document.createElement('div');sw.className='sw';SW.forEach(v=>{const x=document.createElement('button');x.style.background=v;x.title=v;x.setAttribute('aria-label',v);x.onclick=()=>set(it.k,v);sw.appendChild(x)});w.append(c,sw);r.appendChild(w);binds.push(()=>{c.value=S[it.k]})}
  });
  if(fi>=4&&window.innerWidth<=760)f.classList.add('closed');
});
function sync(){binds.forEach(f=>f());ov.style.cursor=S.tool==='none'?(S.win?'move':'default'):'none'}

// ---------- pointer ----------
function imgPt(e){const r=ov.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height,sx:e.clientX-r.left,sy:e.clientY-r.top}}
function pushUndo(){const snap=[addC,remC,lightC].map(c=>{const n=mk();n.width=W;n.height=H;ctx(n).drawImage(c,0,0);return n});undoStack.push(snap);if(undoStack.length>15)undoStack.shift()}
function undo(){const s=undoStack.pop();if(!s){toast('Нечего отменять');return}[addC,remC,lightC].forEach((c,i)=>{const g=ctx(c);g.clearRect(0,0,W,H);g.drawImage(s[i],0,0)});need.m=need.l=true;schedule()}
function dab(c,x,y,r,op){const g=ctx(c);g.save();g.globalCompositeOperation=op;const a=S.bflow/100;const gr=g.createRadialGradient(x,y,r*S.bhard/100,x,y,r);gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.restore()}
function paintAt(x,y){const r=S.bsize/2*W/ov.getBoundingClientRect().width;
  if(S.tool==='stripes'){dab(addC,x,y,r,'source-over');dab(remC,x,y,r,'destination-out')}
  else if(S.tool==='photo'){dab(remC,x,y,r,'source-over');dab(addC,x,y,r,'destination-out')}
  else if(S.tool==='light'){dab(lightC,x,y,r,'source-over')}
  else{for(const c of [addC,remC,lightC])dab(c,x,y,r,'destination-out')}}
const dirty=()=>{if(S.tool==='light')need.l=true;else if(S.tool==='erase'){need.m=need.l=true}else need.m=true};
let drag=null;
ov.addEventListener('pointerdown',e=>{if(!W)return;ov.setPointerCapture(e.pointerId);const p=imgPt(e);
  if(S.tool==='none'){if(!S.win)return;drag={mode:'move',dx:p.x-S.wx/100*W,dy:p.y-S.wy/100*H}}
  else{if(S.tool==='light'&&!S.light)set('light',true);pushUndo();drag={mode:'paint',x:p.x,y:p.y};paintAt(p.x,p.y);dirty();schedule()}});
ov.addEventListener('pointermove',e=>{const p=imgPt(e);
  if(S.tool!=='none'){cursor.style.display='block';cursor.style.left=p.sx+'px';cursor.style.top=p.sy+'px';cursor.style.width=cursor.style.height=S.bsize+'px'}else cursor.style.display='none';
  if(!drag)return;
  if(drag.mode==='move'){S.wx=clamp((p.x-drag.dx)/W*100,0,100);S.wy=clamp((p.y-drag.dy)/H*100,0,100);need.s=need.m=true;schedule()}
  else{const r=S.bsize/2*W/ov.getBoundingClientRect().width,dx=p.x-drag.x,dy=p.y-drag.y,d=Math.hypot(dx,dy),step=Math.max(1,r*0.2);
    for(let t=step;t<=d;t+=step)paintAt(drag.x+dx*t/d,drag.y+dy*t/d);if(d>=step){drag.x=p.x;drag.y=p.y}dirty();schedule()}});
const end=()=>{drag=null};ov.addEventListener('pointerup',end);ov.addEventListener('pointercancel',end);
ov.addEventListener('pointerleave',()=>{cursor.style.display='none'});
window.addEventListener('keydown',e=>{if(e.target.matches('input[type=number]'))return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}
  if(e.key==='[')set('bsize',Math.max(10,S.bsize-20));if(e.key===']')set('bsize',Math.min(600,S.bsize+20))});

// ---------- export ----------
function blobOf(c,type,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),type,q))}
async function save(blob,filename){const dl=dlP?await dlP.catch(()=>null):null;
  if(dl){try{await dl.save({filename,data:blob});toast('Сохранено')}catch(e){const c=e&&e.code;toast(c==='declined'?'Отменено':c==='rate_limited'?'Повторите через пару секунд':'Не удалось сохранить')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('Скачивание недоступно')}}
async function exportImg(){if(!W)return;const was=compare;compare=false;compose(view);
  let out=view;if(S.preset!=='orig'){const [tw,th]=S.preset.split('x').map(Number);const a=tw/th;let cw,ch;if(W/H>a){ch=H;cw=H*a}else{cw=W;ch=W/a}
    const cx=S.win?S.wx/100*W:W/2,cy=S.win?S.wy/100*H:H/2;const x=clamp(cx-cw/2,0,W-cw),y=clamp(cy-ch/2,0,H-ch);out=mk();out.width=tw;out.height=th;const g=ctx(out);g.imageSmoothingQuality='high';g.drawImage(view,x,y,cw,ch,0,0,tw,th)}
  const type={png:'image/png',jpg:'image/jpeg',webp:'image/webp'}[S.fmt];
  if(S.fmt==='jpg'){const f=mk();f.width=out.width;f.height=out.height;const g=ctx(f);g.fillStyle='#fff';g.fillRect(0,0,f.width,f.height);g.drawImage(out,0,0);out=f}
  try{await save(await blobOf(out,type,S.q/100),`${fileBase}-stretch-${out.width}x${out.height}.${S.fmt}`)}catch(e){toast('Не удалось собрать файл')}
  compare=was;schedule()}
async function exportMask(){if(!W)return;const c=mk();c.width=W;c.height=H;const g=ctx(c);g.fillStyle='#000';g.fillRect(0,0,W,H);g.drawImage(maskC,0,0);
  try{await save(await blobOf(c,'image/png'),`${fileBase}-mask-${W}x${H}.png`)}catch(e){toast('Не удалось собрать маску')}}

// demo light so the feature is visible on first open
setImage(sample(),null);
(function demoLight(){const g=ctx(lightC);const gr=g.createRadialGradient(W*0.86,H*0.12,0,W*0.86,H*0.12,W*0.32);gr.addColorStop(0,'rgba(255,255,255,.9)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);need.l=true;schedule()})();
})();
